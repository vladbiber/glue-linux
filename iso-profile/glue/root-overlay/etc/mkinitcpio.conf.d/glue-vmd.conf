# Glue Linux (roadmap 10.8 c): Intel VMD hides the NVMe disks until the vmd
# module is loaded. Harmless on hardware without VMD. mkinitcpio 42.2 reads
# /etc/mkinitcpio.conf.d/*.conf after mkinitcpio.conf. Whether artools'
# buildiso initramfs uses this directory is NOT verified (to confirm in 10.7).
MODULES+=(vmd)
