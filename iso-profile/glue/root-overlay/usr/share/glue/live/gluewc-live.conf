# Live-only gluewc settings, appended to the stock config by glue-live-session
# the first time the live user starts the desktop. Later binds replace earlier
# ones with the same keys, so nothing in config.def.conf is edited and installed
# systems never see this file (it is removed by the offline clone).

# Super+Shift+F1 (re)opens Glue Welcome. Welcome is a single-instance
# application (org.glue.Welcome): a second launch raises the open window.
bind_insert = mod+shift+F1 = spawn:glue-welcome
