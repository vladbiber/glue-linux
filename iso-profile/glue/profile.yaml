---
# Glue Linux — artools buildiso profile (current YAML format).
# The live ISO boots to an autologin shell that points at the TUI installer and
# can preview a window manager via `startx`. `services:`/`user-services:` are
# enabled automatically by artools — no manual runsvdir symlinks.
#
# The live system runs the stock `linux` kernel (from common.yaml) for a robust
# boot; the CachyOS kernel (linux-cachyos) is installed into the TARGET by the
# installer at install time.

live-session:
  user: glue
  password: glue
  autologin: true
  use-xlibre: false
  services:
    - NetworkManager
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber

rootfs:
  packages:
    # --- Glue custom repo packages ---
    - glue-branding
    - st-glue
    # --- TUI installer + its partitioning tools (must be runnable live) ---
    - glue-installer
    - chafa
    - glue-apps
    - glue-welcome
    - flatpak
    - yay
    - artixlinux-appstream-data
    - pacman-contrib
    - gptfdisk
    - parted
    # --- 'Offline install' (3.6): clone the live system to disk with no net.
    #     rsync does the copy; Limine is deployed by the target's own
    #     `glue-boot-update --deploy` (glue-boot, ADR-022), no grub. The clone
    #     uses the live system's STOCK `linux` kernel — linux-cachyos can NOT be
    #     added here: a second kernel breaks artools' make_bootfs (live boot).
    #     Choose the online install to get the CachyOS kernel. ---
    - rsync
    - efibootmgr
    # grub: only for artix-grub-live (the ISO's own boot menu); the clone
    # removes it from the target (glue_installer/clone.py LIVE_ONLY_PACKAGES)
    - grub
    # limine + glue-boot: `limine bios-install`/glue-boot-update on live and
    # copied onto the offline clone (3.1, 3.6)
    - limine
    - glue-boot
    # os-prober: live-only; the installer turns its output into /etc/glue/boot.d (3.4)
    - os-prober
    # laptop audio (SOF/UCM) and early CPU microcode on the live system (10.8 b/c)
    - sof-firmware
    - alsa-ucm-conf
    - intel-ucode
    - amd-ucode
    # --- graphical installer (10.2, ADR-023): Calamares, live-only. Started by
    #     `glue-install-gui` (pkexec); the clone and the online install never
    #     carry it (clone.py LIVE_ONLY_PACKAGES, absent from every plan) ---
    - calamares
    - kpmcore
    - ckbcomp
    - polkit
    - glue-calamares-config
    # --- keyring/mirrorlist the installer's basestrap -C resolves on the host ---
    - cachyos-keyring
    - cachyos-mirrorlist
    # --- networking (so the installer has connectivity: nmtui) ---
    - networkmanager
    - wpa_supplicant
    - openresolv
    # --- graphical login (ReGreet under Cage; Tuigreet fallback without KMS).
    #     Shipped live so the OFFLINE express install can give the installed
    #     disk a real password login too. The live session still autologins. ---
    - accountsservice
    - cage
    - greetd
    - greetd-regreet
    - greetd-tuigreet
    - greetd-runit
    # --- desktop preview bits (preview a WM from the live session) ---
    - xorg-server
    - xorg-xinit
    - xorg-xrandr
    - xorg-xsetroot
    - rofi
    - dmenu
    # --- Wayland preview: test a compositor on real hardware straight from
    #     the stick, before installing. From a tty: `gluewc`. ---
    - gluewc
    # shells to preview: glueqs, and noctalia-shell with its quickshell fork
    # (noctalia-qs provides quickshell; naming it stops pacman picking galaxy's)
    - glueqs
    - noctalia-shell
    - noctalia-qs
    # bar runtime: polkit agent, brightness/media keys, clipboard, battery, power profiles
    - polkit-gnome
    - brightnessctl
    - playerctl
    - wl-clipboard
    - upower
    - power-profiles-daemon
    # notify-send for scripts; both shells own org.freedesktop.Notifications (ADR-020)
    - libnotify
    # portals (screen share, file dialogs) and grim for screenshots; no init pkgs, D-Bus activated
    - xdg-desktop-portal
    - xdg-desktop-portal-wlr
    - xdg-desktop-portal-gtk
    - grim
    - alacritty
    # file manager of gluewc/nvwm installs (GNOME Files)
    - nautilus
    - xorg-xwayland
    - xwayland-satellite
    - pipewire
    - wireplumber
    - pipewire-pulse
    - pipewire-alsa
    - firefox
    - mpv
    - zathura
    - zathura-pdf-mupdf
    - feh
    - dunst
    - pavucontrol
    - lf
    - scrot
    - xclip
    - fastfetch
    - noto-fonts
    - noto-fonts-emoji
    - ttf-dejavu
    - ttf-jetbrains-mono
    # --- handy CLI ---
    - git
    - wget
    - htop
    - vim
    # common.yaml pulls the virtual `vi`; name a concrete provider so the
    # non-interactive rootfs install doesn't stop at a provider prompt.
    - ex-vi-compat
  packages-init:
    dinit:
      - networkmanager-dinit
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - dinit-user-spawn
    openrc:
      - networkmanager-openrc
      - pipewire-openrc
      - pipewire-pulse-openrc
      - wireplumber-openrc
    runit:
      - networkmanager-runit
    s6:
      - networkmanager-s6

livefs:
  packages:
    - squashfs-tools
    - mkinitcpio-nfs-utils
    - artix-grub-live
  packages-init:
    dinit:
      - artix-live-dinit
    openrc:
      - artix-live-openrc
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
