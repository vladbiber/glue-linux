# Generated by glue_installer.calamares_config from catalog.json; do not edit.
# Regenerate: python -m glue_installer.calamares_config
---
modules-search: [ local, /etc/calamares/modules ]
instances:
- id: gluenetwork
  module: notesqml
  config: gluenetwork.conf
- id: gluedesktop
  module: notesqml
  config: gluedesktop.conf
- id: gluekernel
  module: notesqml
  config: gluekernel.conf
- id: glueinit
  module: notesqml
  config: glueinit.conf
- id: gluegaming
  module: notesqml
  config: gluegaming.conf
sequence:
- show:
  - welcome
  - notesqml@gluenetwork
  - locale
  - keyboard
  - partition
  - users
  - notesqml@gluedesktop
  - notesqml@gluekernel
  - notesqml@glueinit
  - notesqml@gluegaming
  - summary
- exec:
  - partition
  - mount
  # basestrap + Glue config + Limine over the mounted root (10.3)
  - glueinstall
  # after basestrap: the filesystem package ships /etc/fstab
  - fstab
  # appends the Glue swapfile line recorded by glueinstall
  - gluefstab
  # locale/keyboard/users after glueinstall: glibc, kbd, shells, groups
  - locale
  - keyboard
  - localecfg
  # needs the target's passwd/group (video, audio, …) and /bin/bash
  - users
  - umount
- show:
  - finished
branding: "glue"
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
