# glueinstall job configuration (Glue Linux).
---
# Selection written by the Glue pages; globalstorage
# `glue_selection` (a dict with the same keys) wins when present.
selection_file: /etc/glue/selection.json
# Live pacman.conf handed to `basestrap -C` (the [glue] file:// repo + [cachyos]).
pacman_conf: /usr/share/glue/pacman.conf
# Where subprocess output of every step goes (never the selection itself).
log_file: /var/log/glue-install.log
