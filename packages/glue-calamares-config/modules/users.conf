---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input
    - network
    - storage
    # glue-settings creates it; on server installs Calamares adds an empty one
    - name: gamemode
      must_exist: false
      system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  template: "glue"
