---
efi:
    mountPoint: "/boot"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
# no `file`: the Glue swapfile (sized from RAM) is created by glueinstall,
# so Calamares' fstab module never makes a second /swapfile
userSwapChoices: [ none, small ]
initialSwapChoice: small
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
# "Encrypt system": the root only (glue_installer.crypt), unlocked by the
# initramfs encrypt hook; /boot is the unencrypted ESP that Limine reads,
# so the "boot partition not encrypted" warning would only confuse.
# glueinstall refuses other encrypted mounts (no crypttab support in Artix rc)
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
showNotEncryptedBootMessage: false
