[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
opacity = 0.5

[font]
size = 11.0

[font.normal]
family = "Liberation Mono"
style = "Regular"

[font.bold]
family = "Liberation Mono"
style = "Bold"

[font.italic]
family = "Liberation Mono"
style = "Italic"

[font.bold_italic]
family = "Liberation Mono"
style = "Bold Italic"

[cursor.style]
shape = "Block"

[colors.primary]
"foreground" = "#f2f2f2"
"background" = "#000000"

[colors.cursor]
"text" = "#000000"
"cursor" = "#d71921"

[colors.selection]
"text" = "#ffffff"
"background" = "#d71921"

[colors.normal]
"black" = "#161616"
"red" = "#ff7871"
"green" = "#57c35f"
"yellow" = "#cca200"
"blue" = "#72a7ff"
"magenta" = "#dc7ee2"
"cyan" = "#00bfc6"
"white" = "#f2f2f2"

[colors.bright]
"black" = "#9a9a9a"
"red" = "#ffb0a8"
"green" = "#72e57a"
"yellow" = "#f2c100"
"blue" = "#a7c9ff"
"magenta" = "#faa2ff"
"cyan" = "#00e2eb"
"white" = "#f2f2f2"

# Ctrl+Shift +/- = persistent font size (Ctrl +/- stays per-session only)
[[keyboard.bindings]]
key = "="
mods = "Control|Shift"
command = { program = "termfont", args = ["alacritty", "+1"] }

[[keyboard.bindings]]
key = "-"
mods = "Control|Shift"
command = { program = "termfont", args = ["alacritty", "-1"] }

[[keyboard.bindings]]
key = "Backspace"
mods = "Control|Shift"
command = { program = "termfont", args = ["alacritty", "reset"] }
