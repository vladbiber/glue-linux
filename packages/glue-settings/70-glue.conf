# /usr/lib/sysctl.d/70-glue.conf - Glue Linux kernel tuning (CachyOS port).
# Also carries the quiet-console printk the installer used to write to
# /etc/sysctl.d/20-glue-quiet.conf - one source of truth when glue-settings
# is installed.

# Swap readily to zram; keep the zram device busy before evicting page cache
vm.swappiness=100
# Keep directory/inode caches longer than the default
vm.vfs_cache_pressure=50
# Absolute dirty thresholds - sane writeback on any RAM size
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864
vm.dirty_writeback_centisecs=1500
# Single-page swap readahead - right for zram/SSD
vm.page-cluster=0
# NMI watchdog off: saves power, frees a perf counter
kernel.nmi_watchdog=0
# Unprivileged user namespaces: Steam/Proton and Flatpak sandboxes need them
kernel.unprivileged_userns_clone=1
# Hide kernel pointers from everyone
kernel.kptr_restrict=2
# Bigger NIC backlog for fast links
net.core.netdev_max_backlog=4096
# Plenty of file handles for games and launchers
fs.file-max=2097152
# Magic SysRq on - last-resort recovery from a hung system
kernel.sysrq=1
# Quiet console: stop kernel/udev lines painting over the greeter's VT
kernel.printk=3 3 3 3
