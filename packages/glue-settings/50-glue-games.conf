# Counter-Strike 2 asks PipeWire for a ~20 ms buffer and crackles whenever a
# frame stalls; give its stream 60 ms, like PULSE_LATENCY_MSEC=60.
pulse.rules = [
    {
        matches = [
            { application.process.binary = "cs2" }
            { application.name = "cs2" }
        ]
        actions = {
            update-props = {
                pulse.min.req = 2880/48000
                pulse.min.quantum = 1024/48000
            }
        }
    }
]
